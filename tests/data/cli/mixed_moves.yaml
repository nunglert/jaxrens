run:
  n_live: 10
  max_iterations: 20
  n_mcmc_steps: 3
  seed: 7

moves:
  - type: random_walk
    step_size: 0.2
    weight: 3.0
    name: rw_main
  - type: galilean
    step_size: 0.05
    n_reflect: 8
    weight: 1.0
    name: gal_main

backend:
  backend_type: harmonic
  n_atoms: 1

output:
  format: none
  working_dir: "."
  info_interval: 999
