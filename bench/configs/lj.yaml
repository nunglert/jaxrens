# bench/configs/lj.yaml — ns_step bench, LJ Ar16 NPT.
#
# Cheap reference run.  No optional deps.  Intended to be the fastest
# bench in the suite; ~10 s end-to-end on a single GPU.

run:
  n_live: 200
  max_iterations: 1            # unused — bench bypasses run_ns
  n_mcmc_steps: 20
  n_extra: 49
  seed: 42

backend:
  type: lj
  epsilon: 1.0
  sigma: 1.0
  cutoff: 2.5
  periodic: true

ensemble:
  type: npt
  pressure: 0.1
  pressure_units: eva3

moves:
  - type: galilean
    n_reflect: 4
    step_size: 0.1
    weight: 2.0
  - type: volume
    step_size: 0.2
    weight: 1.0
  - type: shear
    step_size: 0.05
    weight: 1.0
  - type: stretch
    step_size: 0.05
    weight: 1.0

termination:
  - type: iteration
    max_iterations: 1

init:
  start_species: "18 16"        # 16 Ar atoms
  random_initialise_pos: true
  pos_randomization_mode: grid
  grid_distance: 1.0
  start_energy_ceiling_per_atom: 100.0

cell:
  max_volume_per_atom: 30.0
  min_volume_per_atom: 1.5
  min_aspect_ratio: 0.6
  flat_V_prior: false

output:
  format: none
  working_dir: ./bench/_scratch
  out_file_prefix: bench_lj
