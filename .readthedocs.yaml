version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      - mkdir -p docs/tutorials
      - for f in examples/tutorials/*.py; do [ -f "$f" ] || continue; out="docs/tutorials/$(basename "${f%.py}").ipynb"; jupytext --to ipynb -o "$out" "$f"; done

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
