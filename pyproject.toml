[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxrens"
version = "0.1.0"
description = "JAX-based nested sampling for atomistic systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nico Unglert" },
]
dependencies = [
    "jax[cuda12]>=0.9.0",
    "jaxlib>=0.9.0",
    "numpy>=1.26",
    "h5py>=3.10",
    "ase>=3.22",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
neuralil = ["neuralil"]
mace = ["mace-jax"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[project.scripts]
jaxrens = "jaxrens.cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not heavy'"
markers = [
    "heavy: marks tests as heavy/slow (run with '-m heavy' or '-m \"\"' to include)",
    "gpu: marks tests requiring GPU",
    "multi_gpu: marks tests requiring multiple GPUs",
]
