[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxrens"
# Version is derived from git tags by setuptools-scm (see [tool.setuptools_scm]).
dynamic = ["version"]
description = "JAX-based nested sampling for atomistic systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nico Unglert" },
]
dependencies = [
    "jax[cuda12]>=0.9.0",
    "jaxlib>=0.9.0",
    "numpy>=1.26",
    "h5py>=3.10",
    "ase>=3.22",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jaxtyping>=0.2",
]

[project.optional-dependencies]
neuralil = ["neuralil @ git+https://github.com/nunglert/neuralil-jaxrens.git@jaxrens"]
mace = [
    "mace-jax[jax-cuda12,torch-cuda12] @ git+https://github.com/nunglert/mace-jax.git@fixes"
]
nequix = ["nequix @ git+https://github.com/atomicarchitects/nequix.git@main"]
jaxmd = ["jax-md>=0.2.28"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "beartype>=0.18",
    "pre-commit",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.5",
    "myst-parser>=4.0",
    "nbsphinx>=0.9.7",
    "jupytext>=1.16",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=1.0",
    "autodoc-pydantic>=2.2",
    "ipykernel>=6.29",
    "pypandoc_binary>=1.13",
    "matplotlib>=3.8",
    "squarify>=0.4",
    "plotly>=5.20",
]

[project.scripts]
jaxrens = "jaxrens.cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Version comes from git tags (e.g. ``v0.1.0`` -> ``0.1.0``); commits past a
# tag get a dev version like ``0.1.1.dev3+g<sha>``. ``fallback_version`` keeps
# installs working where git history/tags are unavailable (e.g. the .git-less
# Docker CI build context or a shallow clone) instead of erroring.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not heavy and not mace and not neuralil and not nequix and not jaxmd and not multi_gpu' --jaxtyping-packages=jaxrens.state,jaxrens.sampling,beartype.beartype"
markers = [
    "heavy: marks tests as heavy/slow (run with '-m heavy' or '-m \"\"' to include)",
    "gpu: marks tests requiring GPU",
    "multi_gpu: marks tests requiring multiple GPUs (opt-in via '-m multi_gpu'; needs >=2 local devices)",
    "mace: marks tests that exercise the MACE backend; opt-in only via '-m mace' (needs mace_jax + GPU)",
    "neuralil: marks tests that exercise the NeuralIL backend; opt-in only via '-m neuralil' (needs neuralil)",
    "nequix: marks tests that exercise the nequix backend; opt-in only via '-m nequix' (needs nequix package + bundled or path-loaded model)",
    "jaxmd: marks tests that exercise the jax-md backend (Tersoff/EAM); opt-in only via '-m jaxmd' (needs jax-md package)",
]
