[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxrens"
version = "0.1.0"
description = "JAX-based nested sampling for atomistic systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nico Unglert" },
]
dependencies = [
    "jax[cuda12]>=0.9.0",
    "jaxlib>=0.9.0",
    "numpy>=1.26",
    "h5py>=3.10",
    "ase>=3.22",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
neuralil = ["neuralil @ git+https://github.com/nunglert/neuralil-jaxrens.git@jaxrens"]
mace = [
    "mace-jax[gpu,torch] @ git+https://github.com/nunglert/mace-jax.git@fix_install"
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.5",
    "myst-parser>=4.0",
    "nbsphinx>=0.9.7",
    "jupytext>=1.16",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=1.0",
    "autodoc-pydantic>=2.2",
    "ipykernel>=6.29",
    "pypandoc_binary>=1.13",
    "matplotlib>=3.8",
    "squarify>=0.4",
    "plotly>=5.20",
]

[project.scripts]
jaxrens = "jaxrens.cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not heavy'"
markers = [
    "heavy: marks tests as heavy/slow (run with '-m heavy' or '-m \"\"' to include)",
    "gpu: marks tests requiring GPU",
    "multi_gpu: marks tests requiring multiple GPUs",
]
