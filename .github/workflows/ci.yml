name: CI

on:
  push:
    branches: ['**']      # any branch — per-job `if:` routes by ref
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid racking up ephemeral
# RunsOn GPU instances when pushes land in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Trigger matrix (one instance per event):
#   * Push to a non-main branch  → `cheap` (g4dn.xlarge, smoke + integration).
#   * PR to main / push to main  → `full` (one g4dn.12xlarge: `-n 4` whole
#                                  suite + multi_gpu, see full-suite.yml).
#   * workflow_dispatch          → `full`.
# Note: pushing to a branch that has an open PR fires BOTH `cheap` (push event)
# and `full` (pull_request event).  That's intentional — `cheap` is the fast
# smoke while `full` is the gate — but it does mean an extra small instance.
# Local `pytest tests/smoke tests/integration` covers the narrow-down case
# without paying for an ephemeral CI runner.

jobs:
  cheap:
    name: Cheap (smoke + integration)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=g4dn.xlarge
      - image=ubuntu24-gpu-x64
      - spot=price-capacity-optimized
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t jaxrens-ci:${{ github.sha }} .

      - name: pytest tests/smoke tests/integration
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            jaxrens-ci:${{ github.sha }} \
            pytest tests/smoke tests/integration -v --tb=short -m "not multi_gpu"

  full:
    # Consolidated full + multi-GPU run on a single 4× T4 node.  Defined once
    # in full-suite.yml and shared with weekly.yml.
    if: |
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/full-suite.yml
    secrets: inherit
