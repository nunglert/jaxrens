name: CI

on:
  push:
    branches: ['**']      # any branch — per-job `if:` routes by ref
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid racking up ephemeral
# RunsOn GPU instances when pushes land in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Trigger matrix:
#   * Push to a non-main branch  → `cheap` (g4dn.xlarge, smoke + integration).
#   * Push to main / PR to main  → `full` (g5.xlarge) + `multi_gpu`
#                                  (g4dn.12xlarge, 4× T4) in parallel.
#   * workflow_dispatch          → all three jobs available.
# Local `pytest tests/smoke` / `pytest tests/integration` covers the
# manual narrow-down case without paying for an ephemeral CI runner.

jobs:
  cheap:
    name: Cheap (smoke + integration)
    if: |
      (github.event_name == 'push' && github.ref != 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=g4dn.xlarge
      - image=ubuntu24-gpu-x64
      - spot=price-capacity-optimized
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t jaxrens-ci:${{ github.sha }} .

      - name: pytest tests/smoke tests/integration
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            jaxrens-ci:${{ github.sha }} \
            pytest tests/smoke tests/integration -v --tb=short -m "not multi_gpu" -o addopts=""

  full:
    name: Full (whole pytest suite)
    if: |
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=g5.xlarge
      - image=ubuntu24-gpu-x64
      - spot=price-capacity-optimized
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t jaxrens-ci:${{ github.sha }} .

      - name: pytest tests (with coverage)
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            jaxrens-ci:${{ github.sha }} \
            pytest tests -v --tb=short -m "not multi_gpu" -o addopts="" \
              --cov=jaxrens \
              --cov-branch \
              --cov-report=term-missing \
              --cov-report=xml \
              --cov-fail-under=50

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  multi_gpu:
    name: Multi-GPU integration (4× T4)
    # Runs on PR to main and push to main (parallel to ``full``), plus
    # on-demand via the Actions UI (workflow_dispatch).  Requires
    # g4dn.12xlarge quota; if that quota lapses again, narrow the ``if:``
    # back to ``github.event_name == 'workflow_dispatch'`` to make the job
    # dormant for automatic events.
    if: |
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=g4dn.12xlarge
      - image=ubuntu24-gpu-x64
      - spot=price-capacity-optimized
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t jaxrens-ci:${{ github.sha }} .

      # - name: pytest tests/integration -m multi_gpu
      #   run: |
      #     docker run --rm --gpus all \
      #       -v "${{ github.workspace }}:/workspace" \
      #       -w /workspace \
      #       jaxrens-ci:${{ github.sha }} \
      #       pytest tests -v --tb=short -m multi_gpu -o addopts=""
      - name: pytest -m multi_gpu (whole tree)
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e PYTHONUNBUFFERED=1 \
            -e JAX_LOG_COMPILES=1 \
            -e NCCL_DEBUG=INFO \
            jaxrens-ci:${{ github.sha }} \
            pytest tests -v -s --tb=long -m multi_gpu \
              --timeout=600 --timeout-method=thread \
              -o addopts=""
