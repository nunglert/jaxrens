name: docs-build

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "examples/tutorials/**"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs-build.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "examples/tutorials/**"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

# deploy-pages needs an OIDC token + Pages write scope.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress Pages deploy; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so setuptools-scm derives the real version for
          # the docs (a shallow clone misses tags -> it falls back to 0.0.0).
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jaxrens with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Convert tutorials to notebooks
        run: |
          mkdir -p docs/tutorials
          for f in examples/tutorials/*.py; do
            [ -f "$f" ] || continue
            out="docs/tutorials/$(basename "${f%.py}").ipynb"
            jupytext --to ipynb -o "$out" "$f"
          done

      - name: Build Sphinx site
        run: sphinx-build -b html --keep-going docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Only publish from main — never from PRs (forks can't get the Pages token anyway).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
