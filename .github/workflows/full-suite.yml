name: Full suite (reusable)

# Consolidated heavy run on a SINGLE 4× T4 node (g4dn.12xlarge):
#   1. the whole pytest suite parallelised with ``-n 4`` (each xdist worker
#      pinned to its own GPU by tests/conftest.py), then
#   2. the multi_gpu integration tests.
# Both run sequentially on the same ephemeral instance so a PR / main / weekly
# run costs ONE GPU instance instead of fanning out to two.  Invoked via
# ``workflow_call`` from ci.yml (PR + push-to-main) and weekly.yml (cron).
on:
  workflow_call:

jobs:
  full:
    name: Full (-n 4) + multi-GPU (4× T4)
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=g4dn.12xlarge
      - image=ubuntu24-gpu-x64
      - spot=price-capacity-optimized
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t jaxrens-ci:${{ github.sha }} .

      - name: pytest tests -n 4 (full suite, coverage)
        # ``--gpus all`` exposes all 4 T4s; tests/conftest.py pins each xdist
        # worker (gw0..gw3) to a distinct GPU before JAX is imported.
        #
        # ``--require-backends=all`` turns a missing optional backend into a
        # hard failure instead of a skip.  Dockerfile.ci installs all four
        # extras, so any of them being unimportable here means the image built
        # wrong -- and without this flag those tests would simply be skipped
        # and the run would still exit 0.
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            jaxrens-ci:${{ github.sha }} \
            pytest tests -n 4 -v --tb=short -m "not multi_gpu" -o addopts="" \
              --require-backends=all \
              --cov=jaxrens \
              --cov-branch \
              --cov-report=term-missing \
              --cov-report=xml \
              --cov-fail-under=50

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: pytest -m multi_gpu (whole tree)
        # Always run even if the full suite failed, so a single flaky test
        # doesn't hide multi-GPU regressions.
        if: ${{ always() }}
        # ``--shm-size=1g``: the 4× T4 on g4dn.12xlarge have no NVLink, so
        # NCCL uses its SHM/direct transport for intra-node GPU↔GPU comms,
        # which lives in /dev/shm.  Docker's default 64 MB /dev/shm is too
        # small for 4-rank NCCL — 1 GB is ample headroom.
        run: |
          docker run --rm --gpus all \
            --shm-size=1g \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e PYTHONUNBUFFERED=1 \
            -e JAX_LOG_COMPILES=1 \
            -e NCCL_DEBUG=INFO \
            jaxrens-ci:${{ github.sha }} \
            pytest tests -v -s --tb=long -m multi_gpu \
              --timeout=600 --timeout-method=thread \
              -o addopts=""
