# 8-atom Lennard-Jones solid, NPT ensemble at P = 0.1 epsilon/sigma^3.
#
# Small but non-trivial NS run: demonstrates mixed-move MWG (atomic + volume +
# shear + stretch), burn-in, step-size adaptation, cell constraints, and
# periodic output / checkpointing.
#
# Expected runtime on a single modern GPU: a few minutes.
# Expected outcome: log_evidence should decrease monotonically; the final
# live-walker energies cluster around the LJ FCC minimum.

run:
  n_live: 128
  max_iterations: 2000
  n_mcmc_steps: 20
  n_extra: 49
  seed: 42

backend:
  type: lj
  epsilon: 1.0
  sigma: 1.0
  cutoff: 2.5
  periodic: true

ensemble:
  type: npt
  pressure: 0.1
  pressure_units: eva3

moves:
  - type: galilean
    n_reflect: 10
    step_size: 0.1
    weight: 4.0
  - type: volume
    step_size: 0.3
    weight: 1.0
  - type: shear
    step_size: 0.1
    weight: 1.0
  - type: stretch
    step_size: 0.1
    weight: 1.0

termination:
  # - type: iteration
  #   max_iterations: 5000
  - type: prior_mass
    threshold: 1.e-5

adaptation:
  full_auto: true
  defaults:
    min_rate: 0.3
    max_rate: 0.5
    adjust_factor: 1.5
    step_size_max: 0.2
  per_move:
    galilean:
      step_size_max: 0.5

init:
  start_species: "18 64"
  random_initialise_pos: true
  pos_randomization_mode: grid
  grid_distance: 1.0
  random_initialise_cell: true
  initial_walk:
    n_walks: 5
    walklength: 50
    adjust_interval: 2
    emax_offset_per_atom: 1.0

cell:
  max_volume_per_atom: 20.0
  min_volume_per_atom: 0.5
  min_aspect_ratio: 0.6
  flat_V_prior: false

output:
  format: extxyz
  working_dir: ./output
  out_file_prefix: lj8_npt
  info_interval: 100
  traj_interval: 50
  snapshot_interval: 500
  checkpoint_interval: 500
