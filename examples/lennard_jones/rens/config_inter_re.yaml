# 8-atom Lennard-Jones solid, NPT ensemble — 2 parallel runs at P=0.01 and P=0.1
# with pressure-RENS inter-replica-exchange every iteration.
#
# Uses run_ns_parallel directly (CLI only supports single-run; multi-run with
# inter-RE requires the library API).
# Pressures: [0.01, 0.1] eV/Å³ (low and moderate).
#
# Expected outcome: inter_re stats line appears in monitor; swaps happen between
# the two pressure replicas; log_Z per run differs (different ensembles).

run:
  n_live: 64
  max_iterations: 200
  n_mcmc_steps: 10
  n_extra: 20
  seed: 42
  n_runs: 2

backend:
  type: lj
  epsilon: 1.0
  sigma: 1.0
  cutoff: 2.5
  periodic: true

ensemble:
  type: npt
  pressure: [0.01, 0.1]
  pressure_units: eva3

inter_re:
  flavor: pressure
  every: 1
  n_swap_cycles: 1

moves:
  - type: galilean
    n_reflect: 10
    step_size: 0.1
    weight: 4.0
  - type: volume
    step_size: 0.3
    weight: 1.0
  - type: shear
    step_size: 0.1
    weight: 1.0
  - type: stretch
    step_size: 0.1
    weight: 1.0

termination:
  # - type: iteration
  #   max_iterations: 5000
  - type: prior_mass
    threshold: 1.e-5

adaptation:
  full_auto: true
  defaults:
    min_rate: 0.3
    max_rate: 0.5
    adjust_factor: 1.5
    step_size_max: 0.2
  per_move:
    galilean:
      step_size_max: 0.5

init:
  start_species: "18 64"
  random_initialise_pos: true
  pos_randomization_mode: grid
  grid_distance: 1.0
  random_initialise_cell: true
  initial_walk:
    n_walks: 5
    walklength: 50
    adjust_interval: 2
    emax_offset_per_atom: 1.0

cell:
  max_volume_per_atom: 20.0
  min_volume_per_atom: 0.5
  min_aspect_ratio: 0.6
  flat_V_prior: false

output:
  format: extxyz
  working_dir: ./output
  out_file_prefix: lj8_npt
  info_interval: 100
  traj_interval: 50
  snapshot_interval: 500
  checkpoint_interval: 500
