# 8-atom Lennard-Jones cluster, NPT at P = 0.1 eV/A^3 (reduced units).
#
# The smallest physically meaningful jaxrens run: small enough to finish in
# under a minute on one GPU, complete enough to exercise mixed-move MWG,
# burn-in, step-size adaptation, cell constraints and post-processing.
#
# Run it with:
#     jaxrens validate -c config.yaml
#     jaxrens run -c config.yaml

run:
  n_live: 32           # tiny: resolution is poor, but it finishes fast
  max_iterations: 500
  n_mcmc_steps: 10     # decorrelation per replacement walker
  # Walkers MCMC-walked in parallel each iteration is 1 + n_extra, so this
  # is the batch width the GPU actually sees. Left at 0 only one chain
  # runs and the device idles; it does not change the population size.
  n_extra: 15
  seed: 42

backend:
  type: lj
  epsilon: 1.0
  sigma: 1.0
  cutoff: 2.5
  periodic: true
  # Periodic-image expansion. With only 8 atoms the smallest cell the prior
  # permits is far thinner than 2 * cutoff, so the minimum-image convention
  # alone would undercount neighbours. `jaxrens validate` warns when this is
  # too small -- drop it to [1, 1, 1] to see that check fire.
  supercell_trafo: [2, 2, 2]

ensemble:
  type: npt            # adds P*V, so the cell moves below do work
  pressure: 0.1
  pressure_units: eva3

moves:
  - {type: gmc, n_reflect: 6, step_size: 0.1, weight: 4.0}
  - {type: volume, step_size: 0.2, weight: 1.0}
  - {type: shear, step_size: 0.08, weight: 1.0}
  - {type: stretch, step_size: 0.08, weight: 1.0}

termination:
  - type: prior_mass
    threshold: 1.0e-3

adaptation:
  full_auto: true
  adjust_interval: 50
  defaults: {min_rate: 0.3, max_rate: 0.5, adjust_factor: 1.5, step_size_max: 0.2}
  per_move:
    gmc: {step_size_max: 0.5}

init:
  start_species: "18 64"          # 8 argon atoms
  random_initialise_pos: true
  pos_randomization_mode: grid
  grid_distance: 1.0
  random_initialise_cell: true
  initial_walk: {n_walks: 3, walklength: 20, adjust_interval: 1, emax_offset_per_atom: 1.0}

cell:
  max_volume_per_atom: 20.0
  min_volume_per_atom: 0.5
  min_aspect_ratio: 0.6

output:
  format: extxyz
  working_dir: ./output
  out_file_prefix: lj8
  info_interval: 50
  traj_interval: 1               # every dead point -- post-processing needs them
  checkpoint_interval: 250
