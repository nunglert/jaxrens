# 16-atom Sn (tin), MACE, 32-replica pressure-RENS, NPT.
#
# A real production config from an active-learning NS campaign, lightly
# adapted for the docs: `backend.checkpoint_path` below points at the tiny
# fixture bundle in tests/_assets/ so `jaxrens validate` runs from a fresh
# checkout with no download -- point it at your own converted model for the
# real thing (see ../../../docs/user/mace_models.md).
#
# This is not a tutorial to run casually: 32 replicas of a message-passing
# potential, to convergence, is a multi-GPU job measured in hours, not a
# fast demo. See the tutorial page for why each parameter below is set the
# way it is -- validate it, read it, do not expect to run it from a laptop.
#
# Validate it with:
#     jaxrens validate -c config.yaml

interval_units: per_walker   # every interval below is in walker-sweeps, not
                              # raw iterations -- see the tutorial page

run:
  n_live: 200
  n_cull: 1
  n_extra: 19
  n_mcmc_steps: 50      # expensive energy evals -- decorrelate hard per one
  max_iterations: 4000  # sweeps -> 800,000 raw iterations; a ceiling well
                         # above what `termination:` below should ever need

backend:
  type: mace
  checkpoint_path: ../../../tests/_assets/models/mace_mp_small
  periodic: true
  # Must span >= 2 * the model's receptive field at the *tightest* cell
  # cell: below allows -- see the tutorial page for the arithmetic.
  supercell_trafo: [3, 3, 3]
  max_neighbors_list: [20, 25, 30, 35, 40, 45, 50, 60]
  max_neighbors_offset: 4
  max_neighbors_shrink_dwell: 10

ensemble:
  type: npt
  # One replica every 0.5 GPa from 0 to 15.5 -- see the tutorial page for
  # why a ladder this dense, rather than a handful of pressures.
  pressure: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5,
             6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0,
             11.5, 12.0, 12.5, 13.0, 13.5, 14.0, 14.5, 15.0, 15.5]
  pressure_units: gpa

inter_re:
  flavor: pressure
  re_interval: 0.002    # sweeps -> clamped to 1 raw iteration: a swap
                         # attempt every single NS step
  n_swap_cycles: 50

moves:
  # gmc and random_walk both move atoms -- deliberately, not redundantly:
  # gmc uses the model's forces and is efficient where they are smooth,
  # random_walk does not depend on gradient quality at all and is a
  # fallback where an MLIP's forces are noisy near the cutoff. Cell moves
  # carry most of the weight, same as any NPT run.
  - {type: gmc, weight: 4.0, step_size: 0.01, n_reflect: 2}
  - {type: random_walk, weight: 8.0, step_size: 0.01}
  - {type: volume, weight: 16.0}
  - {type: stretch, weight: 8.0}
  - {type: shear, weight: 8.0}

termination:
  # Stop on physics (cooled to 100 K), not on an iteration count.
  - type: temperature
    target_temp: 100.0

adaptation:
  full_auto: true
  adjust_interval: 0.5     # sweeps -> adapts twice per walker-sweep
  trial_batch_size: 8
  defaults: {min_rate: 0.2, max_rate: 0.5, adjust_factor: 1.5, step_size_max: 5}
  per_move:
    # Keyed by move name, which falls back to `type:` when no `name:` is
    # set -- so this must say "gmc", not "galilean" (the legacy alias only
    # rewrites the moves: list itself, not per_move keys). A "galilean" key
    # here would silently no-op and gmc would fall through to `defaults`.
    gmc: {step_size_max: 10}

init:
  start_species: "50 16"          # 16 atoms of Sn (Z=50)
  random_initialise_cell: true
  pos_randomization_mode: grid
  grid_distance: 3.0
  initial_walk:
    n_walks: 10
    walklength: 100
    emax_offset_per_atom: 2.0
    write_initial_walkers: true
    walker_batch_size: 16

cell:
  # beta-Sn's bulk density is ~27 A^3/atom; these bracket it with real
  # headroom on both sides (dense/compressed through expanded/molten)
  # rather than pinning the prior to one phase.
  max_volume_per_atom: 90.0
  min_volume_per_atom: 18.0
  min_aspect_ratio: 0.8
  flat_V_prior: false

constraints:
  - type: minimum_distance
    d_min: 1.7

output:
  format: extxyz
  working_dir: ./output
  out_file_prefix: mace_sn16
  info_interval: 0.03           # sweeps -> every 6 iterations
  traj_interval: 0.02           # sweeps -> every 4 iterations: dense, for
                                 # downstream active-learning retraining
  snapshot_interval: 5
  snapshot_clean: true
  checkpoint_interval: 5
  log_level: debug
  save_re_stats: true
  temperature_lag_interval: 2
  temperature_interval: 0.2
  save_max_neighbors: true
  max_neighbors_interval: 0.1
  flush_interval: 0.1
  collision_check_threshold: 1.3
  collision_check_interval: 1.0
