# 16-atom silicon, NPT at 1 GPa, with a MACE-MP foundation model.
#
# Everything MACE-specific lives in the `backend:` block. The rest is the
# same shape as the Lennard-Jones tutorial.
#
#     jaxrens validate -c config.yaml --full
#     jaxrens run -c config.yaml

run:
  n_live: 32
  max_iterations: 200
  n_mcmc_steps: 10
  # Walkers MCMC-walked in parallel each iteration is 1 + n_extra, so this
  # is the batch width the GPU actually sees. Left at 0 only one chain
  # runs and the device idles; it does not change the population size.
  n_extra: 15
  seed: 42

backend:
  type: mace
  # Any of: a bundle directory, a .json/.msgpack pair, an orbax .ckpt, the
  # converter's .npz, or a .pkl -- one loader handles all five. This points
  # at the tiny bundled fixture so the tutorial runs from a fresh checkout;
  # for real work use the model you converted (see the docs page).
  checkpoint_path: ../../../tests/_assets/models/mace_mp_small
  periodic: true
  # MACE-MP has r_cutoff = 6 A, so the cell must span >= 12 A after tiling.
  supercell_trafo: [3, 3, 3]
  # Neighbour-capacity ladder: the run climbs it on overflow, recompiling
  # once per rung. Keep it short to bound the number of recompiles.
  max_neighbors_list: [35, 50, 65, 85, 100]
  max_neighbors_offset: 4

ensemble:
  type: npt
  pressure: 1.0
  pressure_units: gpa

moves:
  # Cell moves carry most of the weight here: at fixed composition the
  # interesting degrees of freedom for a crystal are volume and shape.
  - {type: gmc, n_reflect: 4, step_size: 0.03, weight: 2.0}
  - {type: volume, step_size: 0.05, weight: 16.0}
  - {type: shear, step_size: 0.02, weight: 8.0}
  - {type: stretch, step_size: 0.02, weight: 8.0}

termination:
  - type: iteration
    max_iterations: 200

adaptation:
  full_auto: true
  adjust_interval: 25
  defaults: {min_rate: 0.3, max_rate: 0.5, adjust_factor: 1.5, step_size_max: 0.2}

init:
  start_species: "14 16"          # 16 silicon atoms
  random_initialise_pos: true
  pos_randomization_mode: grid
  grid_distance: 1.5
  start_energy_ceiling_per_atom: 100.0
  initial_walk: {n_walks: 3, walklength: 20, adjust_interval: 1, emax_offset_per_atom: 1.0}

cell:
  max_volume_per_atom: 60.0
  min_volume_per_atom: 12.0
  min_aspect_ratio: 0.5

output:
  format: extxyz
  working_dir: ./output
  out_file_prefix: si16
  info_interval: 25
  traj_interval: 1
  checkpoint_interval: 100
